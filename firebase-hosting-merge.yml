name: Deploy Frontend to Firebase Hosting (Live)

on:
  push:
    branches: [main]
    paths:
      - 'bakery-frontend/**'
      - '.github/workflows/firebase-hosting-merge.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bakery-frontend/package-lock.json

      - name: Install dependencies
        working-directory: bakery-frontend
        run: npm ci

      - name: Build
        working-directory: bakery-frontend
        # ตั้ง Secret ชื่อ VITE_API_BASE_URL ใน GitHub repo settings ให้ชี้ไปที่ Backend
        # ที่ Deploy แยกไว้จริง (Render/Fly.io/Cloud Run) ก่อน — ถ้าไม่ตั้ง Frontend จะ
        # เรียก '/api' แบบสัมพัทธ์ ซึ่งใช้ไม่ได้บน Firebase Hosting (ดู README)
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PO_INNOVA }}'
          projectId: po-innova
          entryPoint: bakery-frontend
          channelId: live
