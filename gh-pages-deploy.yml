name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'bakery-frontend/**'
      - '.github/workflows/gh-pages-deploy.yml'
  workflow_dispatch: # กดรันเองได้จากแท็บ Actions ด้วย เผื่อไม่ได้แก้โค้ดแต่อยากลอง Deploy ใหม่

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bakery-frontend/package-lock.json

      - name: Install dependencies
        working-directory: bakery-frontend
        run: npm ci

      - name: Build
        working-directory: bakery-frontend
        env:
          # /<repo-name>/ เสมอ เพราะ GitHub Pages Project Site อยู่ที่ <user>.github.io/<repo>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # ตั้ง Secret ชื่อ VITE_API_BASE_URL ใน repo settings ให้ชี้ไปที่ Backend
          # ที่ Deploy แยกไว้จริง ไม่งั้น Frontend จะเรียก '/api' แบบสัมพัทธ์ซึ่งใช้ไม่ได้
          # บน GitHub Pages (ดู README/DEPLOY.md)
          VITE_API_BASE: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: bakery-frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
