name: Deploy Frontend to Firebase Hosting (PR Preview)

on:
  pull_request:
    branches: [main]
    paths:
      - 'bakery-frontend/**'
      - '.github/workflows/firebase-hosting-pull-request.yml'

jobs:
  build_and_preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bakery-frontend/package-lock.json

      - name: Install dependencies
        working-directory: bakery-frontend
        run: npm ci

      - name: Build
        working-directory: bakery-frontend
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PO_INNOVA }}'
          projectId: po-innova
          entryPoint: bakery-frontend
